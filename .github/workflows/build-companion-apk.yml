name: Build Android Companion APK

on:
  push:
    paths:
      - 'android-companion/**'
      - '.github/workflows/build-companion-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Companion APK
        working-directory: android-companion
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-companion/app/build/outputs/apk/debug/app-debug.apk pixel-cyd-companion.apk

      - name: Upload APK to Latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view companion-latest >/dev/null 2>&1; then
            gh release upload companion-latest pixel-cyd-companion.apk --clobber
          else
            gh release create companion-latest pixel-cyd-companion.apk \
              --title "Pixel CYD Android Companion" \
              --notes "Latest direct-download APK for the Pixel CYD Android Companion app."
          fi
